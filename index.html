<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Research</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 id="main-title">DOM Research</h1>

    <!-- Section 1: Basic Elements -->
    <div class="section">
        <h2>Section 1: Basic Elements</h2>
        <p class="text">First paragraph</p>
        <p class="text">Second paragraph</p>
        <p class="text highlight">Third paragraph with highlight</p>
    </div>

    <!-- Section 2: Navigation Test -->
    <div class="section" id="nav-section">
        <h2>Section 2: Navigation</h2>
        <ul id="main-list">
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </div>

    <!-- Section 3: Attributes -->
    <div class="section">
        <h2>Section 3: Attributes</h2>
        <input type="text" id="input-field" value="Initial value" data-custom="test-data">
        <button id="test-btn" disabled>Button</button>
    </div>

    <!-- Section 4: Content Modification -->
    <div class="section">
        <h2>Section 4: Content</h2>
        <div id="content-box">
            <p>Original content</p>
        </div>
    </div>

    <!-- Section 5: Styles -->
    <div class="section">
        <h2>Section 5: Styles</h2>
        <div id="style-box">Style target</div>
    </div>

    <!-- Section 6: classList -->
    <div class="section">
        <h2>Section 6: classList</h2>
        <div id="class-demo">Class Demo Box</div>
        <button id="toggle-btn">Toggle Classes</button>
    </div>

    <script src="index.js"></script>
</body>

</html>
